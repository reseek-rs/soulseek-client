[package]
name = "soulseek-client"
description = "Soulseek client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# the engine the crate's own integration tests reach into
testing = []

[dependencies]
soulseek-proto.workspace = true

bitflags.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# the crate itself, with the engine its integration tests use
soulseek-client = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
